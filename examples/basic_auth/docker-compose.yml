services:
  cerebro:
    image: chosenwar/cerebro:latest
    environment:
      # Required by the image: replace with a long random value
      - CEREBRO_SECRET=replace-with-a-long-random-secret
      # Basic auth using admin/admin user
      - AUTH_TYPE=basic
      - BASIC_AUTH_USER=admin
      - BASIC_AUTH_PWD=admin
    ports:
      - 9000:9000
