services:
  cerebro:
    image: chosenwar/cerebro:0.9.4-secure
    environment:
      # Required by the image: replace with a long random value
      - CEREBRO_SECRET=replace-with-a-long-random-secret
      - AUTH_TYPE=ldap
      - LDAP_URL=ldap://ldap:389
      - LDAP_BASE_DN=DC=example,DC=org
      - LDAP_METHOD=simple
      - LDAP_USER_TEMPLATE=uid=%s,%s
    ports: 
      - 9000:9000
  open_ldap:
    image: osixia/openldap:1.4.0
    container_name: ldap
    ports: 
      - 389:389
      - 636:636
    volumes: 
      - ./users:/opt
