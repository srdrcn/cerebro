# Production must provide CEREBRO_SECRET or -Dplay.http.secret.key. Play's own
# "changeme" value remains available only for dev/test and is rejected in prod.
play.http.secret.key = ${?CEREBRO_SECRET}

# Keep these security controls available when an external -Dconfig.file is
# used instead of the bundled application.conf.
play.http.session {
  httpOnly = true
  sameSite = "lax"
  secure = ${?CEREBRO_COOKIE_SECURE}
}
play.http.flash {
  httpOnly = true
  sameSite = "lax"
  secure = ${play.http.session.secure}
}
play.filters.hosts.allowed += ${?CEREBRO_ALLOWED_HOST}

es {
  gzip = false
}
play.ws.compressionEnabled = ${es.gzip}

# The application languages
play.i18n.langs = ["en"]

# The application base path
basePath = "/"
play.http.context = ${basePath}

# Database configuration
data.path = "./cerebro.db"
slick.dbs.default.driver = "slick.driver.SQLiteDriver$"
slick.dbs.default.db.driver = org.sqlite.JDBC
slick.dbs.default.db.url = "jdbc:sqlite:"${data.path}
play.evolutions.db.default.autoApply = true
