@()(implicit request: RequestHeader, flash: Flash)

@import models.BuildInfo

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to Cerebro">
    <meta name="csrf-token" content="@play.filters.csrf.CSRF.getToken(request).map(_.value).getOrElse("")">
    <title>Cerebro</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="js/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell" aria-labelledby="login-title">
      <header class="login-brand">
        <img src="img/logo.png" alt="" width="126">
        <h1 id="login-title">Cerebro</h1>
        <p>v@BuildInfo.version</p>
      </header>

      @if(flash.get(controllers.AuthController.LOGIN_MSG).exists(_.nonEmpty)) {
        <div class="login-error" role="alert">
          @flash.get(controllers.AuthController.LOGIN_MSG).getOrElse("")
        </div>
      }

      <form class="login-form" action="auth/login" method="POST">
        @helper.CSRF.formField
        <div>
          <label for="inputUser">User</label>
          <input type="text" name="user" id="inputUser" autocomplete="username" required autofocus>
        </div>
        <div>
          <label for="inputPassword">Password</label>
          <input type="password" name="password" id="inputPassword" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
